kyverno:
  grafana:
    enabled: true
    grafanaDashboard:
      create: true
      folder: kyverno
      allowCrossNamespaceImport: true
      matchLabels:
        dashboards: "grafana"
  admissionController:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring # Replace with your prometheus-stack release name
  backgroundController:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  cleanupController:
    rbac:
      create: true
      clusterRole:
        extraResources: []
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  reportsController:
    enabled: true
    #replicas: 2
    revisionHistoryLimit: 4
    resyncPeriod: 60m
    extraArgs:
      clientRateLimitQPS: "500"
      clientRateLimitBurst: "500"
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  features:
    backgroundScan:
      backgroundScanInterval: 2h   # default is 1h
  metricsConfig:
    enabled: true
        # - apiGroups:
        #     - ''
        #   resources:
        #     - pods
        #   verbs:
        #     - delete
        #     - list
        #     - watch
