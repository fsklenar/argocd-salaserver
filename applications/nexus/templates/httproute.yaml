apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-nexus
  namespace: nexus
spec:
  hostnames:
    - nexus.linuxadmin.eu
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway-https
      namespace: kube-system
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: nexus
          port: 8081
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
